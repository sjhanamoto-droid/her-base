<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HER BASE｜現役プロアスリートを支える妻・パートナーのための、審査制の会員制ライフサポートサービス</title>
    <meta name="description" content="HER BASEは、現役プロアスリートを支える妻・パートナーが安心してつながり、孤独を感じず前向きな一歩を踏み出せる、審査制の会員制ライフサポートサービスです。同じ立場の仲間との出会いや、先輩パートナーとの座談会、専門家講座をお届けします。" />

    <!-- Favicon（HERBASELOGO_260910：ゴールド地 × 白のHマーク） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <meta name="theme-color" content="#f8f4ee" />

    <!-- OGP -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HER BASE｜現役プロアスリートを支える妻・パートナーのための、審査制の会員制ライフサポートサービス" />
    <meta property="og:description" content="ひとりじゃない、と思える場所へ。現役プロアスリートを支える妻・パートナーが、同じ立場の仲間と安心してつながる、審査制の会員制ライフサポートサービス、HER BASE。" />
    <meta property="og:site_name" content="HER BASE" />
    <meta property="og:url" content="https://her-base.com/" />
    <meta property="og:image" content="https://her-base.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://her-base.com/og-image.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Shippori+Mincho:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Allura&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // ブランドカラー：ロゴ（HERBASELOGO_260910）のゴールドベージュ #C8A17B を基準に展開
              // 500 がロゴの色そのもの。小さな文字には 700 以上、線・アイコン・ボタン地には 500 を使う。
              brand: {
                50:  '#faf6f1',
                100: '#f4ebe1',
                200: '#eadbc9',
                300: '#dfc6aa',
                400: '#d4b493',
                500: '#c8a17b', // HER BASE ロゴのゴールドベージュ
                600: '#ad8660',
                700: '#8a6742',
                800: '#6b5139',
                900: '#4a3826',
              },
              // ベース（生成り）：ロゴの白地に馴染む、ややウォームなオフホワイト
              base: {
                50:  '#fcfaf7',
                100: '#f8f4ee',
                200: '#f0e9df',
                300: '#e4d9ca',
              },
              // 墨色：ロゴのゴールドと同系色相のダークブラウン（見出し・本文）
              ink: {
                DEFAULT: '#2a2016',
                900: '#2a2016',
                800: '#362a1e',
                700: '#4a3b2c',
                600: '#5e4d3c', // 本文
                500: '#7a6853', // 補足テキスト
                400: '#9b8b77', // キャプション・コピーライト
              },
            },
            fontFamily: {
              serif: ['"Shippori Mincho"', '"Playfair Display"', 'serif'],
              sans: ['"Zen Kaku Gothic New"', 'sans-serif'],
              mincho: ['"Shippori Mincho"', 'serif'],
              cinzel: ['"Cinzel"', 'serif'],
              display: ['"Cormorant Garamond"', 'serif'],
              script: ['"Allura"', 'cursive'],
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Zen Kaku Gothic New', sans-serif;
        background-color: #f8f4ee;
      }
      .font-cinzel { font-family: 'Cinzel', serif; }
      .font-mincho { font-family: 'Shippori Mincho', serif; }
      .font-display { font-family: 'Cormorant Garamond', serif; }
      .font-script { font-family: 'Allura', cursive; }
      .animate-fade-in {
        animation: fadeIn 1s ease-out forwards;
        opacity: 0;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .stroke-text {
        -webkit-text-stroke: 1px #c8a17b;
        color: transparent;
      }
      ::selection { background: #eadbc9; color: #2a2016; }
    </style>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
