<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HER BASE｜アスリートを支える人のための、審査制クローズドコミュニティ</title>
    <meta name="description" content="HER BASEは、アスリートを支える人が安心してつながり、孤独を感じず前向きな一歩を踏み出せる、審査制のクローズドコミュニティです。同じ立場の仲間との出会いや、有名選手の奥様のお話会、専門家との対談・相談会をお届けします。" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <meta name="theme-color" content="#f3efe8" />

    <!-- OGP -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HER BASE｜アスリートを支える人のための、審査制クローズドコミュニティ" />
    <meta property="og:description" content="ひとりじゃない、と思える場所へ。アスリートを支える人が、同じ立場の仲間と安心してつながる審査制のクローズドコミュニティ、HER BASE。" />
    <meta property="og:image" content="/favicon-512.png" />
    <meta name="twitter:card" content="summary" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Shippori+Mincho:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Allura&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // ロゴのゴールドを基準にしたブランドカラー
              gold: {
                50:  '#faf3e2',
                100: '#f3e6c4',
                200: '#e8cf94',
                300: '#dab765',
                400: '#c9a044',
                500: '#b78829', // HER BASE ロゴのゴールド
                600: '#9e7323',
                700: '#7d591f',
                800: '#63471d',
                900: '#523c1b',
              },
              // ロゴ背景のアイボリー/クリーム
              cream: {
                50:  '#fdf8ef',
                100: '#fbf1e1',
                200: '#f6e6cd',
                300: '#efd8b4',
                400: '#e5c795',
              },
              // ウォームな黒（エスプレッソ）
              ink: {
                DEFAULT: '#221a10',
                900: '#221a10',
                800: '#2e2417',
                700: '#3d3120',
              },
              // リニューアル後のベース（生成り）とトープ系アクセント
              base: {
                50:  '#f8f6f1',
                100: '#f3efe8',
                200: '#eae4d9',
                300: '#ddd5c6',
              },
              oak: {
                300: '#c2b39f',
                400: '#a6957f',
                500: '#8b7c6b',
                600: '#6f6355',
                700: '#574d42',
              },
            },
            fontFamily: {
              serif: ['"Shippori Mincho"', '"Playfair Display"', 'serif'],
              sans: ['"Zen Kaku Gothic New"', 'sans-serif'],
              mincho: ['"Shippori Mincho"', 'serif'],
              cinzel: ['"Cinzel"', 'serif'],
              display: ['"Cormorant Garamond"', 'serif'],
              script: ['"Allura"', 'cursive'],
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Zen Kaku Gothic New', sans-serif;
        background-color: #f3efe8;
      }
      .font-cinzel { font-family: 'Cinzel', serif; }
      .font-mincho { font-family: 'Shippori Mincho', serif; }
      .font-display { font-family: 'Cormorant Garamond', serif; }
      .font-script { font-family: 'Allura', cursive; }
      .animate-fade-in {
        animation: fadeIn 1s ease-out forwards;
        opacity: 0;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .stroke-text {
        -webkit-text-stroke: 1px #b78829;
        color: transparent;
      }
      ::selection { background: #eae4d9; color: #221a10; }
    </style>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
